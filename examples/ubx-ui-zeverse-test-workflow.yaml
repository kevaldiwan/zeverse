# Example workflow written for one specific product repo (heavy Jest setup). To use it elsewhere:
# - Copy under YOUR repo as `.zeverse/workflows/<name>.yaml`; adjust shell commands (npm/yarn/pnpm),
#   install flags, and test runners to match your project.
# - Set that repo's `defaultBranch` in hub `repos.json` (or the UI Import) before running against it.
#
# Originally: sync into a target repo as `.zeverse/workflows/test.yaml` on the branch Zeverse uses
# as `defaultBranch` for that repo. Zeverse clones have no `node_modules` — install in a shell step first.
# After pushing upstream, refresh the hub workflow cache if needed (see bottom).
name: test
description: Run Jest (optionally scoped) and summarise failures with suggested fixes.
inputs:
  - id: pattern
    label: Test path pattern (e.g. src/pages/billing, leave blank for all)
    required: false
  - id: branch
    label: Git branch to run tests on (leave blank for repo default)
    required: false
steps:
  # ubx-ui needs --legacy-peer-deps. Try ci when a lockfile exists; fall back if it is out of sync with package.json.
  - id: install
    kind: shell
    command: |
      if [ -f package-lock.json ]; then
        npm ci --legacy-peer-deps || npm install --legacy-peer-deps
      else
        npm install --legacy-peer-deps
      fi

  # Use project's Jest (from node_modules), not `npx jest` which can download Jest 30+ without jsdom.
  - id: jest
    kind: shell
    command: |
      if [ -n "{{inputs.pattern}}" ]; then
        npm exec -- jest --watchAll=false --passWithNoTests --colors=false "{{inputs.pattern}}"
      else
        npm exec -- jest --watchAll=false --passWithNoTests --colors=false
      fi
    continueOnError: true

  - id: summarise
    kind: llm
    prompt: |
      Jest output for UBX UI:

      {{steps.jest.output}}

      Write Slack-friendly mrkdwn for teammates. Use `1.` `2.` `3.` for main sections and `*bold*` for small labels.

      Wrap the primary summary so it is easy to slice later:

      --- TEST SUMMARY ---
      ...your structured summary here...
      --- END TEST SUMMARY ---

      Inside that block, output sections **in this exact order**:

      1. **Workflow status** — Two lines:
         - Whether the Zeverse workflow completed (tests command ran and summarisation ran).
         - **Tests:** pass vs fail using the same counts as Jest’s summary lines (suites and tests).

      2. **PASS / FAIL metrics** — A compact block in a fenced code fence (Slack does not render Markdown tables reliably). Include suites, tests, snapshots if present, and time from Jest output.

      3. **Failing tests** — Only if any tests failed. For **each** failure include:
         - Test name and file path.
         - *Why it failed* (assertion / expectation vs stack).
         - *Classification* — exactly one of: `production code bug`, `logic/behavior mismatch`, `test wrong or outdated`, `config/tooling/environment`, `flaky`.
         - *What to change* — one concrete next step.

      4. **Warnings worth addressing** — Console warnings, DOM/React warnings, MSW issues, etc., if visible in the output.

      5. **Slow / flaky tests worth attention** — briefly, if any stand out.

      If everything passed (no failed suites/tests), say so clearly in section 1 and keep sections 3–5 brief or omit when nothing applies.

# After updating this file on GitHub, either wait ~60s for workflow cache TTL or:
#   curl -X POST "http://127.0.0.1:3100/api/repos/ubx-ui/refresh-workflows"
